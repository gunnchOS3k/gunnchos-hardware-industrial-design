name: Portfolio hardening CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: python3 scripts/check_required_files.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: EVT-1 BOM validation
        run: python3 scripts/validate_bom.py
      - name: Supply-chain fields (unknown stays unknown)
        run: |
          python3 scripts/compile_supply_chain_fields.py
          python3 scripts/validate_supply_chain_fields.py
      - name: Digital manufacturing packet
        run: python3 scripts/validate_digital_manufacturing.py
      - name: EVT-1 tests
        run: pytest -q tests/test_bom_schema.py tests/test_required_files.py tests/test_supply_chain_fields.py tests/test_digital_manufacturing.py
