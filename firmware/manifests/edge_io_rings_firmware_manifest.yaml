- freestanding_arm_clang_mcuboot_dev
- zephyr_west_hard_gate
hardware_interfaces:
  ble_mcu:
    mpn: nRF52840-QIAA-R
  imu:
    mpn: BMI270
  cap_touch:
    mpn: IQS7222A
  uwb:
    mpn: DWM3001C
  se:
    mpn: SE050C1HQ1
