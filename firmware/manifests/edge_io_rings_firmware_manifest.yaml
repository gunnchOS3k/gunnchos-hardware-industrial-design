  evidence: artifacts/hw002/zephyr_west/ZEPHYR_WEST_PROBE.json
  token: RING_ZEPHYR_WEST_BUILD_PASS
capsule_update:
  supported: true
  simulated_only: true
claim_boundary: >-
  HW-002: hardware-repo Zephyr west workspace requires real `west build`
  (soft-skip forbidden). RING_ZEPHYR_WEST_BUILD_PASS is digital-only.
  Full fusion drivers remain in edge-io. Physical flash/boot pending.
  HW_FIRMWARE_DIGITAL_PACKAGE_COMPLETE remains false.
digital_implementation_open:
- Physical multimodal tracking / flash
- Full fusion west app parity continuously synced from edge-io
- UWB Qorvo BINARY_BLOB portions
